<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <title>Free Fire ID Checker - Hashan</title>
</head>
<body>

    <h1>Free Fire ID තොරතුරු පරීක්ෂකය</h1>
    <hr>

    <p>පරිශීලක හැඳුනුම්පත (Player ID) ඇතුළත් කරන්න:</p>
    
    <input type="number" id="playerID" placeholder="උදා: 123456789">
    
    <button onclick="checkPlayerInfo()">තොරතුරු සොයන්න</button>

    <br><br>
    <hr>

    <div id="displayArea">
        <p>තොරතුරු මෙහි දර්ශනය වනු ඇත.</p>
    </div>

    <script>
        async function checkPlayerInfo() {
            const id = document.getElementById("playerID").value;
            const displayArea = document.getElementById("displayArea");

            if (!id) {
                alert("කරුණාකර නිවැරදි ID එකක් ඇතුළත් කරන්න!");
                return;
            }

            displayArea.innerHTML = "<b>තොරතුරු සොයමින් පවතී... කරුණාකර රැඳී සිටින්න.</b>";

            try {
                // සටහන: මෙය තෙවන පාර්ශවීය API එකකි. 
                // ඇතැම් විට මෙය ක්‍රියා නොකිරීමට ඉඩ ඇත.
                const response = await fetch(`https://freefireapi.com.br/api/id/${id}?lang=en`);
                
                if (response.ok) {
                    const data = await response.json();

                    // තොරතුරු HTML ලෙස සැකසීම
                    let infoHtml = `
                        <h3>ගිණුමේ විස්තර:</h3>
                        <ul>
                            <li><b>නම (Nickname):</b> ${data.nickname}</li>
                            <li><b>මට්ටම (Level):</b> ${data.level}</li>
                            <li><b>ප්‍රාදේශීය කලාපය (Region):</b> ${data.region}</li>
                            <li><b>Rank Points:</b> ${data.rankp}</li>
                        </ul>
                    `;
                    displayArea.innerHTML = infoHtml;
                } else {
                    displayArea.innerHTML = "<p style='color:red;'>තොරතුරු සොයාගත නොහැකි විය. ID එක නිවැරදිදැයි පරීක්ෂා කරන්න.</p>";
                }
            } catch (error) {
                console.error(error);
                displayArea.innerHTML = "<p style='color:red;'>සම්බන්ධතාවයේ දෝෂයක් පවතී. පසුව නැවත උත්සාහ කරන්න.</p>";
            }
        }
    </script>

</body>
  </html>
