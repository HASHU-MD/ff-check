<!DOCTYPE html>
<html>
<head>
    <title>Simple Car Racing Game</title>
    <style>
        body { margin: 0; background: #222; overflow: hidden; font-family: 'Arial', sans-serif; }
        #gameArea {
            width: 400px;
            height: 100vh;
            background: #333;
            margin: auto;
            position: relative;
            border-left: 5px dashed #fff;
            border-right: 5px dashed #fff;
            overflow: hidden;
        }
        .car {
            width: 50px;
            height: 80px;
            background: #ff0000;
            position: absolute;
            bottom: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px #000;
        }
        .enemy {
            width: 50px;
            height: 80px;
            background: #00ffcc;
            position: absolute;
            border-radius: 5px;
        }
        .line {
            width: 10px;
            height: 100px;
            background: white;
            position: absolute;
            left: 195px;
        }
        #score {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 20px;
            background: rgba(0,0,0,0.5);
            padding: 10px;
        }
    </style>
</head>
<body>

    <div id="score">Score: 0</div>
    <div id="gameArea"></div>

    <script>
        const gameArea = document.getElementById('gameArea');
        const scoreElement = document.getElementById('score');
        let player = { speed: 5, score: 0 };
        let keys = {};

        document.addEventListener('keydown', (e) => { keys[e.key] = true; });
        document.addEventListener('keyup', (e) => { keys[e.key] = false; });

        function createCar() {
            let car = document.createElement('div');
            car.setAttribute('class', 'car');
            gameArea.appendChild(car);
            player.x = car.offsetLeft;
            player.y = car.offsetTop;
            return car;
        }

        let myCar = createCar();

        function moveLines() {
            let lines = document.querySelectorAll('.line');
            lines.forEach(function(item) {
                if (item.y >= 700) { item.y -= 750; }
                item.y += player.speed;
                item.style.top = item.y + "px";
            });
        }

        function moveEnemy(car) {
            let enemies = document.querySelectorAll('.enemy');
            enemies.forEach(function(item) {
                if (isCollide(car, item)) {
                    alert("Game Over! Score: " + player.score);
                    location.reload();
                }
                if (item.y >= 750) {
                    item.y = -300;
                    item.style.left = Math.floor(Math.random() * 350) + "px";
                    player.score++;
                    scoreElement.innerText = "Score: " + player.score;
                }
                item.y += player.speed;
                item.style.top = item.y + "px";
            });
        }

        function isCollide(a, b) {
            aRect = a.getBoundingClientRect();
            bRect = b.getBoundingClientRect();
            return !((aRect.top > bRect.bottom) || (aRect.bottom < bRect.top) || 
                     (aRect.right < bRect.left) || (aRect.left > bRect.right));
        }

        function gamePlay() {
            if (player.start) {
                moveLines();
                moveEnemy(myCar);

                if (keys.ArrowLeft && player.x > 0) { player.x -= player.speed; }
                if (keys.ArrowRight && player.x < 350) { player.x += player.speed; }
                if (keys.ArrowUp && player.y > 100) { player.y -= player.speed; }
                if (keys.ArrowDown && player.y < 600) { player.y += player.speed; }

                myCar.style.top = player.y + "px";
                myCar.style.left = player.x + "px";

                window.requestAnimationFrame(gamePlay);
            }
        }

        // Initialize Game
        player.start = true;
        for (x = 0; x < 5; x++) {
            let roadLine = document.createElement('div');
            roadLine.setAttribute('class', 'line');
            roadLine.y = (x * 150);
            roadLine.style.top = roadLine.y + "px";
            gameArea.appendChild(roadLine);
        }

        for (x = 0; x < 3; x++) {
            let enemyCar = document.createElement('div');
            enemyCar.setAttribute('class', 'enemy');
            enemyCar.y = ((x + 1) * 350) * -1;
            enemyCar.style.top = enemyCar.y + "px";
            enemyCar.style.left = Math.floor(Math.random() * 350) + "px";
            gameArea.appendChild(enemyCar);
        }

        window.requestAnimationFrame(gamePlay);
    </script>
</body>
</html>
