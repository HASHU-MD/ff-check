<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Chat Web</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        
        body {
            background-color: #0d0d0d;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
        }

        .chat-container {
            width: 400px;
            height: 600px;
            background: #1a1a1a;
            border: 1px solid #00ffcc;
            display: flex;
            flex-direction: column;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 0 20px #00ffcc55;
        }

        /* Header Section */
        .chat-header {
            padding: 15px;
            background: #00ffcc;
            color: #000;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chat-header .status-dot {
            width: 10px; height: 10px;
            background: #000;
            border-radius: 50%;
        }

        /* Messages Area */
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background-image: radial-gradient(#111 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .message {
            max-width: 80%;
            padding: 10px 15px;
            border-radius: 15px;
            font-size: 14px;
            line-height: 1.4;
        }

        .sent {
            align-self: flex-end;
            background: #00ffcc;
            color: #000;
            border-bottom-right-radius: 2px;
        }

        .received {
            align-self: flex-start;
            background: #333;
            color: #fff;
            border-bottom-left-radius: 2px;
        }

        /* Input Area */
        .chat-input-area {
            padding: 15px;
            background: #111;
            display: flex;
            gap: 10px;
            border-top: 1px solid #333;
        }

        input {
            flex: 1;
            background: #222;
            border: 1px solid #444;
            padding: 10px;
            color: white;
            border-radius: 5px;
            outline: none;
        }

        input:focus { border-color: #00ffcc; }

        button {
            background: #00ffcc;
            border: none;
            padding: 0 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <div class="status-dot"></div>
            <span>CYBER CHAT GROUP</span>
        </div>

        <div class="chat-messages" id="chatBox">
            <div class="message received">Mokada wenne? Meka oyage chat web eka!</div>
            <div class="message sent">Patta! Mama meka design karanawa.</div>
        </div>

        <div class="chat-input-area">
            <input type="text" id="msgInput" placeholder="Messege ekak gahanna..." onkeypress="handleEnter(event)">
            <button onclick="sendMessage()">SEND</button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chatBox');
        const msgInput = document.getElementById('msgInput');

        function sendMessage() {
            const text = msgInput.value;
            if (text.trim() !== "") {
                // Create new message div
                const msgDiv = document.createElement('div');
                msgDiv.classList.add('message', 'sent');
                msgDiv.innerText = text;
                
                // Add to chat box
                chatBox.appendChild(msgDiv);
                
                // Clear input
                msgInput.value = "";
                
                // Scroll to bottom
                chatBox.scrollTop = chatBox.scrollHeight;

                // Auto reply (Demo purpose)
                setTimeout(() => {
                    const replyDiv = document.createElement('div');
                    replyDiv.classList.add('message', 'received');
                    replyDiv.innerText = "System: Message eka labuna!";
                    chatBox.appendChild(replyDiv);
                    chatBox.scrollTop = chatBox.scrollHeight;
                }, 1000);
            }
        }

        function handleEnter(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
    </script>

</body>
</html>
