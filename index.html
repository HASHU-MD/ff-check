<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hashuu Login</title>
    <style>
        /* Dark Theme Styling */
        body {
            margin: 0;
            padding: 0;
            background-color: #0a0a0a;
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-card {
            background: #151515;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.2);
            width: 350px;
            text-align: center;
            border: 1px solid #333;
        }

        h2 {
            color: #00d4ff;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #222;
            color: #fff;
            box-sizing: border-box;
            outline: none;
        }

        input:focus { border-color: #00d4ff; }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #00d4ff;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #0099cc;
            box-shadow: 0 0 10px #00d4ff;
        }

        #msg {
            margin-top: 15px;
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <audio id="myAudio" loop>
        <source src="https://raw.githubusercontent.com/HASHU-MD/hashu-database-music/refs/heads/main/VID-20260411-WA0000.mp4" type="audio/mpeg">
    </audio>

    <div class="login-card">
        <h2>Admin Login</h2>
        <input type="text" id="user" placeholder="Username">
        <input type="password" id="pass" placeholder="Password">
        <button onclick="login()">LOGIN</button>
        <p id="msg"></p>
    </div>

    <script>
        // Username saha Passwords list eka methana thiyenne
        const users = [
            { username: "HASHUU", password: "HSSHSS2024" },
            { username: "USER1", password: "PASS1234" },
            { username: "ADMIN", password: "LOGIN2026" },
            { username: "WHITE_MD", password: "WHITE2024" },
            { username: "GHOST", password: "PASSWORD77" },
            { username: "HASHAN", password: "MD_OFFICIAL" }
        ];

        function login() {
            const uInput = document.getElementById("user").value;
            const pInput = document.getElementById("pass").value;
            const m = document.getElementById("msg");
            const audio = document.getElementById("myAudio");

            // Input karapu user list eke thiyeda kiyala check kirima
            const validUser = users.find(u => u.username === uInput && u.password === pInput);

            if (validUser) {
                m.style.color = "#00ff88";
                m.innerHTML = "Success! Please wait 10 sec Redirecting...";
                
                // Music play kirima
                audio.play().catch(e => console.log("Audio play error:", e));

                // Redirect kirima
                setTimeout(() => {
                    window.location.href = "https://www.mediafire.com/file/jflvsywz79y41zr/WHITE-MD-main_%25281%2529.zip/file";
                }, 9000);

            } else {
                m.style.color = "#ff4d4d";
                m.innerHTML = "Invalid credentials! Try again.";
            }
        }
    </script>

</body>
</html>
