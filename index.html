<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Login Page - Hashuu</title>
    <style>
        /* Dark Theme Styling */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f0f0f;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .login-box {
            background-color: #1a1a1a;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            width: 350px;
            text-align: center;
            border: 1px solid #333;
        }

        h2 {
            margin-bottom: 30px;
            color: #00d4ff;
            letter-spacing: 2px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            border: 1px solid #444;
            border-radius: 8px;
            background-color: #252525;
            color: #fff;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
        }

        input:focus {
            border-color: #00d4ff;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #00d4ff;
            border: none;
            border-radius: 8px;
            color: #000;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        button:hover {
            background-color: #0099cc;
            transform: translateY(-2px);
        }

        #error-msg {
            color: #ff4d4d;
            margin-top: 15px;
            font-size: 14px;
            display: none;
        }
    </style>
</head>
<body>

    <audio id="bgMusic" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>

    <div class="login-box">
        <h2>LOGIN</h2>
        <div class="input-group">
            <input type="text" id="username" placeholder="Username">
        </div>
        <div class="input-group">
            <input type="password" id="password" placeholder="Password">
        </div>
        <button onclick="validateLogin()">LOG IN</button>
        <p id="error-msg">Invalid Username or Password!</p>
    </div>

    <script>
        function validateLogin() {
            var user = document.getElementById("username").value;
            var pass = document.getElementById("password").value;
            var error = document.getElementById("error-msg");
            var music = document.getElementById("bgMusic");

            // Username saha Password pariksha kirima
            if (user === "HASHUU" && pass === "HASHUU2010") {
                // Music play kirima (Browser settings nisa user action ekakin pasu play we)
                music.play().catch(error => console.log("Music play failed: ", error));
                
                alert("Login Success! Redirecting...");
                
                // Nirdeshitha site ekata auto redirect kirima
                window.location.href = "https://hashan-md-official-page.vercel.app/";
            } else {
                // Weradi credentials nam error message eka pennima
                error.style.display = "block";
                document.getElementById("username").value = "";
                document.getElementById("password").value = "";
            }
        }
    </script>

</body>
</html>
